  <!-- Memo pane -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const papersToggle = document.getElementById("papersToggle");
    const papersPane = document.getElementById("papersPane");

    const memoToggle = document.getElementById("memoToggle");
    const memoPane = document.getElementById("memoPane");

    function togglePane(pane) {
      pane.classList.toggle("hidden");

      if (!pane.classList.contains("hidden")) {
        pane.classList.remove("animate-fadeIn");
        void pane.offsetWidth;
        pane.classList.add("animate-fadeIn");
      }
    }

    papersToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      togglePane(papersPane);
      memoPane.classList.add("hidden");
    });

    memoToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      togglePane(memoPane);
      papersPane.classList.add("hidden");
    });

    document.addEventListener("click", (event) => {
      const clickedPapers =
        papersToggle.contains(event.target) ||
        papersPane.contains(event.target);

      const clickedMemos =
        memoToggle.contains(event.target) ||
        memoPane.contains(event.target);

      if (!clickedPapers) {
        papersPane.classList.add("hidden");
      }

      if (!clickedMemos) {
        memoPane.classList.add("hidden");
      }
    });
  });
</script>

  <!-- Fade-in animation -->
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
